name: project_builder
description: Interactive project generator with feature selection
version: 1.0.0

environment:
  mason: ">=0.1.0 <1.0.0"

vars:
  features:
    type: array
    description: Features to include
    default:
      - app_skeleton
    values:
      - app_skeleton
      - login
      - register
      - settings
      - profile
    prompt: Select features to generate
